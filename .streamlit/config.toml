# Streamlit theme - HR Insight "Aurora Glass" (stitch_ecoglass_nature_ui spec)
# Base = LIGHT; the in-app Day/Night toggle injects the CSS palette each rerun.
# These tokens seed Streamlit's native components before CSS injection loads.

[theme]
base = "light"
primaryColor = "#0284c7"           # Sky-600 — primary azure actions
backgroundColor = "#faf8ff"        # Aurora canvas
secondaryBackgroundColor = "#ffffff"
textColor = "#131b31"              # on-surface deep navy
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false
